const secondsToHours = (seconds) => (seconds / 3600).toFixed(1);

const getStatusColor = (status) => {
  const colors = {
    'OPEN': 'bg-red-500/20 text-red-400 border-red-500/30',
    'In Progress': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
    'REVIEW': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
    'TESTING': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
    'Re-Open': 'bg-orange-500/20 text-orange-400 border-orange-500/30',
  };
  return colors[status] || 'bg-gray-500/20 text-gray-400 border-gray-500/30';
};

const getPriorityColor = (priority) => priority === 'High' ? 'text-red-400' : 'text-yellow-400';

                  <h3 className="font-semibold text-slate-200">FO Bug Status Distribution</h3>
                  <span className="text-xs px-2 py-1 bg-blue-500/20 text-blue-400 rounded-full">{foStats.total} bugs</span>
                </div>
                <div className="space-y-3">
                  {Object.entries(foStats.byStatus).map(([status, count]) => (
                    <div key={status} className="flex items-center gap-3">

                      <div className="flex-1 h-2 bg-slate-700/50 rounded-full overflow-hidden">

                      <span className="text-slate-400 text-sm font-mono w-8">{count}</span>
                    </div>

                <div className="space-y-3">

                      <span className={`px-2 py-0.5 rounded text-xs font-medium border ${getStatusColor(status)}`}>{status}</span>
                      <div className="flex-1 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-purple-400 to-pink-400 rounded-full" style={{ width: `${(count / boStats.total) * 100}%` }} />

                      <span className="text-slate-400 text-sm font-mono w-8">{count}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">

                <div className="flex items-center gap-4 p-4 bg-red-500/10 rounded-xl border border-red-500/20">

                  <div>
                    <div className="text-2xl font-bold text-red-400">{foBugs.filter(b => b.priority === 'High').length + boBugs.filter(b => b.priority === 'High').length}</div>

                  </div>
                </div>
                <div className="flex items-center gap-4 p-4 bg-yellow-500/10 rounded-xl border border-yellow-500/20">
                  <div className="text-3xl">🟡</div>
                  <div>
                    <div className="text-2xl font-bold text-yellow-400">{foBugs.filter(b => b.priority === 'Medium').length + boBugs.filter(b => b.priority === 'Medium').length}</div>
                    <div className="text-slate-400 text-sm">Medium Priority</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* FO Bugs Tab */}
        {activeTab === 'bugs-fo' && (
          <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
            <div className="flex flex-wrap justify-between items-center gap-4 mb-4">
              <h3 className="font-semibold text-slate-200">FrontOffice (FO) Bugs</h3>
              <span className="text-xs px-3 py-1.5 bg-blue-500/20 text-blue-400 rounded-full">{foBugs.length} bugs • {secondsToHours(foStats.totalEstimate)}h estimation</span>
            </div>
            <div className="flex flex-wrap gap-2 mb-4">
              {['all', 'OPEN', 'In Progress', 'REVIEW', 'TESTING'].map(filter => (
                <button key={filter} onClick={() => setFoFilter(filter)} className={`px-3 py-1.5 rounded-lg text-sm transition-all ${foFilter === filter ? 'bg-emerald-500 text-slate-900' : 'bg-slate-700/50 text-slate-400 hover:text-white border border-slate-600/50'}`}>
                  {filter === 'all' ? `All (${foBugs.length})` : `${filter} (${foStats.byStatus[filter] || 0})`}
                </button>
              ))}
            </div>
            <div className="max-h-[600px] overflow-y-auto pr-2">
              {filteredFoBugs.map(bug => <BugItem key={bug.key} bug={bug} expanded={expandedBugs[bug.key]} onToggle={() => toggleBug(bug.key)} />)}
            </div>
          </div>
        )}

        {/* BO Bugs Tab */}
        {activeTab === 'bugs-bo' && (
          <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">

              <span className="text-xs px-3 py-1.5 bg-purple-500/20 text-purple-400 rounded-full">{boBugs.length} bugs • {secondsToHours(boStats.totalEstimate)}h estimation</span>
            </div>
            <div className="flex flex-wrap gap-2 mb-4">
              {['all', 'OPEN', 'TESTING', 'Re-Open'].map(filter => (
                <button key={filter} onClick={() => setBoFilter(filter)} className={`px-3 py-1.5 rounded-lg text-sm transition-all ${boFilter === filter ? 'bg-purple-500 text-slate-900' : 'bg-slate-700/50 text-slate-400 hover:text-white border border-slate-600/50'}`}>
                  {filter === 'all' ? `All (${boBugs.length})` : `${filter} (${boStats.byStatus[filter] || 0})`}
                </button>
              ))}
            </div>
            <div className="max-h-[600px] overflow-y-auto pr-2">
              {filteredBoBugs.map(bug => <BugItem key={bug.key} bug={bug} expanded={expandedBugs[bug.key]} onToggle={() => toggleBug(bug.key)} />)}
            </div>
          </div>
        )}

        {/* Timeline Tab */}
        {activeTab === 'timeline' && (
          <div className="space-y-6">
            <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
              <h3 className="font-semibold text-slate-200 mb-6 flex items-center gap-2">
                <span className="w-1 h-6 bg-gradient-to-b from-emerald-400 to-cyan-400 rounded"></span>
                Project Timeline & Additional Tasks
              </h3>
              <div className="ml-2">
                <TimelineItem date="Phase 1 - Current Sprint" title="Bug Fixing - FO Module" description="Fix 57 bugs trong FrontOffice application bao gồm validation, UI/UX issues, API integration, và workflow bugs." estimation={`${secondsToHours(foStats.totalEstimate)}h (FO bugs)`} icon="🐛" />
                <TimelineItem date="Phase 1 - Current Sprint" title="Bug Fixing - BO Module" description="Fix 11 bugs trong BackOffice application bao gồm Transfer Type, Search, Deny workflow, và data synchronization." estimation={`${secondsToHours(boStats.totalEstimate)}h (BO bugs)`} icon="🐛" />
                <TimelineItem date="Phase 2 - Next Sprint" title="Refactor List/Search Module" description="Refactor lại module List và Search để cải thiện performance và user experience." estimation="3 days dev + 2 days re-test = 5 days" icon="🔄" />
                <TimelineItem date="Phase 3" title="Import Feature Implementation" description="Implement batch file processing cho Excel, CSV, và text formats. Support up to 10MB files, 40,000 records." estimation="10 days working + 3 days test = 13 days" icon="📥" />
                <TimelineItem date="Phase 4 - SIT" title="Regression Testing on SIT" description="Full regression testing trên môi trường SIT để đảm bảo tất cả modules hoạt động ổn định." estimation="5-7 working days" icon="🧪" />
              </div>
            </div>

            <div className="bg-emerald-500/10 rounded-2xl p-6 border border-emerald-500/30">
              <h3 className="font-semibold text-emerald-400 mb-4">📊 Total Estimation Summary</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                  <div className="text-3xl font-bold font-mono text-white">{secondsToHours(foStats.totalEstimate + boStats.totalEstimate)}h</div>
                  <div className="text-slate-400 text-sm">Bug Fixing (FO + BO)</div>
                </div>
                <div>
                  <div className="text-3xl font-bold font-mono text-white">18-20d</div>
                  <div className="text-slate-400 text-sm">Additional Tasks</div>
                </div>
                <div>
                  <div className="text-3xl font-bold font-mono text-white">5-7d</div>
                  <div className="text-slate-400 text-sm">Regression SIT</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Team Tab */}
        {activeTab === 'team' && (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-semibold text-slate-200">FO Team Estimation</h3>
                <span className="text-xs px-2 py-1 bg-blue-500/20 text-blue-400 rounded-full">5 members</span>
              </div>
              <div className="space-y-1">
                {Object.entries(foStats.byAssignee).sort((a, b) => b[1].estimate - a[1].estimate).map(([name, data], i) => (
                  <TeamMember key={name} name={name} bugs={data.count} hours={secondsToHours(data.estimate)} maxHours={35} gradient={gradients[i % gradients.length]} />
                ))}
              </div>
              <div className="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                <span className="text-slate-400 font-medium">Total</span>
                <div className="text-right">
                  <span className="text-slate-200 font-mono">{foStats.total} bugs</span>
                  <span className="text-emerald-400 font-mono ml-4">{secondsToHours(foStats.totalEstimate)}h</span>
                </div>
              </div>
            </div>

            <div className="bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-semibold text-slate-200">BO Team Estimation</h3>
                <span className="text-xs px-2 py-1 bg-purple-500/20 text-purple-400 rounded-full">4 members</span>
              </div>
              <div className="space-y-1">
                {Object.entries(boStats.byAssignee).sort((a, b) => b[1].estimate - a[1].estimate).map(([name, data], i) => (
                  <TeamMember key={name} name={name} bugs={data.count} hours={secondsToHours(data.estimate)} maxHours={8} gradient={gradients[i % gradients.length]} />
                ))}
              </div>
              <div className="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                <span className="text-slate-400 font-medium">Total</span>
                <div className="text-right">
                  <span className="text-slate-200 font-mono">{boStats.total} bugs</span>
                  <span className="text-purple-400 font-mono ml-4">{secondsToHours(boStats.totalEstimate)}h</span>
                </div>
              </div>
            </div>

            <div className="lg:col-span-2 bg-slate-800/30 rounded-2xl p-6 border border-slate-700/50">
              <h3 className="font-semibold text-slate-200 mb-4">Additional Development Tasks</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-slate-500 text-xs uppercase tracking-wider border-b border-slate-700/50">
                      <th className="text-left py-3 px-4">Task</th>
                      <th className="text-left py-3 px-4">Dev Time</th>
                      <th className="text-left py-3 px-4">Test Time</th>
                      <th className="text-left py-3 px-4">Total</th>
                      <th className="text-left py-3 px-4">Status</th>
                    </tr>
                  </thead>
                  <tbody className="text-slate-300">
                    <tr className="border-b border-slate-700/30 hover:bg-slate-700/20">
                      <td className="py-3 px-4">🔄 Regression Module (SIT)</td>
                      <td className="py-3 px-4 text-slate-500">-</td>
                      <td className="py-3 px-4">5-7 days</td>
                      <td className="py-3 px-4 font-mono text-emerald-400">5-7 days</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 rounded text-xs bg-slate-600/50 text-slate-300">Planned</span></td>
                    </tr>
                    <tr className="border-b border-slate-700/30 hover:bg-slate-700/20">
                      <td className="py-3 px-4">🔧 Refactor List/Search</td>
                      <td className="py-3 px-4">3 days</td>
                      <td className="py-3 px-4">2 days</td>
                      <td className="py-3 px-4 font-mono text-emerald-400">5 days</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 rounded text-xs bg-slate-600/50 text-slate-300">Planned</span></td>
                    </tr>
                    <tr className="border-b border-slate-700/30 hover:bg-slate-700/20">
                      <td className="py-3 px-4">📥 Import Feature</td>
                      <td className="py-3 px-4">10 days</td>
                      <td className="py-3 px-4">3 days</td>
                      <td className="py-3 px-4 font-mono text-emerald-400">13 days</td>
                      <td className="py-3 px-4"><span className="px-2 py-0.5 rounded text-xs bg-slate-600/50 text-slate-300">Planned</span></td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr className="bg-slate-700/20 font-semibold">
                      <td className="py-3 px-4 text-slate-200">Total Additional Tasks</td>
                      <td className="py-3 px-4">13 days</td>
                      <td className="py-3 px-4">10-12 days</td>
                      <td className="py-3 px-4 font-mono text-orange-400">23-25 days</td>
                      <td className="py-3 px-4"></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
